<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Modal Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css" rel="stylesheet" type="text/css" />
</head>
<body class="bg-gray-100 p-8">
    <div class="flex items-center justify-center min-h-screen">
        <div class="modal modal-open">
            <div class="modal-box bg-white rounded-lg shadow-2xl max-w-md w-5/6 mx-4 relative border-2 border-pink-200">
                <!-- Header -->
                <div class="text-center mb-6">
                    <div class="text-6xl mb-4">💕</div>
                    <h3 class="text-2xl font-bold mb-2 bg-gradient-to-r from-pink-600 via-purple-600 to-red-500 bg-clip-text text-transparent">
                        Valentine's Day Special
                    </h3>
                    <div class="w-16 h-1 bg-gradient-to-r from-pink-400 via-purple-400 to-red-400 mx-auto rounded-full mb-4"></div>
                </div>

                <!-- Content -->
                <div class="text-center mb-6">
                    <p class="text-lg text-gray-700 mb-4">
                        <span class="font-bold bg-gradient-to-r from-pink-600 to-red-500 bg-clip-text text-transparent text-5xl">
                            10% OFF
                        </span>
                    </p>
                    <p class="text-gray-600 mb-4">
                        Any Classic or Bali setup!
                    </p>
                    <div class="bg-gradient-to-br from-pink-50 via-purple-50 to-red-50 p-4 rounded-lg mb-4 border border-pink-200">
                        <p class="text-sm font-medium mb-1">
                            <span class="text-purple-700">Classic:</span> <span class="line-through text-gray-400">$299</span> → <span class="font-bold text-pink-600">$269</span>
                        </p>
                        <p class="text-sm font-medium mt-1">
                            <span class="text-purple-700">Bali:</span> <span class="line-through text-gray-400">$399</span> → <span class="font-bold text-pink-600">$359</span>
                        </p>
                        <p class="text-xs text-gray-500 mt-2 italic">
                            Limited time offer - book now to secure your discount!
                        </p>
                    </div>
                </div>

                <!-- Actions -->
                <div class="modal-action flex flex-col sm:flex-row gap-3">
                    <button class="btn text-white hover:opacity-90 transition-all flex-1 py-2 shadow-lg bg-gradient-to-r from-pink-500 via-purple-500 to-red-500 hover:from-pink-600 hover:via-purple-600 hover:to-red-600">
                        💝 Book Now & Save 10%!
                    </button>
                    <button class="py-2 btn btn-outline border-2 border-pink-300 text-pink-600 hover:bg-pink-50 hover:border-pink-400 transition-colors flex-1">
                        Check Later
                    </button>
                </div>

                <!-- Close button -->
                <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2 text-gray-400 hover:text-pink-500" aria-label="Close modal">
                    ✕
                </button>
            </div>
        </div>
    </div>
</body>
</html>
